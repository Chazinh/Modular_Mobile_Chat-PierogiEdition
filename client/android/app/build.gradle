apply plugin: 'com.android.application'

// Release signing: the keystore and its passwords stay OUT of the repository. Point MC_KEYSTORE_PROPS to a
// properties file (storeFile, storePassword, keyAlias, keyPassword) or create client/android/keystore.properties
// (git-ignored). Without it, assembleRelease produces an unsigned APK.
def mcProps = new Properties()
def mcPropsFile = new File(System.getenv('MC_KEYSTORE_PROPS') ?: "${rootDir}/keystore.properties")
if (mcPropsFile.exists()) mcPropsFile.withInputStream { mcProps.load(it) }

// Optional private identity (git-ignored): applicationId, versionCode and versionName for a personal build that
// must update an app already installed under another package. Point MC_ANDROID_PRIVATE_PROPS to the file or create
// client/android/private-build.properties. The code namespace never changes.
def mcBuild = new Properties()
def mcBuildFile = new File(System.getenv('MC_ANDROID_PRIVATE_PROPS') ?: "${rootDir}/private-build.properties")
if (mcBuildFile.exists()) mcBuildFile.withInputStream { mcBuild.load(it) }

// Optional, private resource directory. Never bundle someone else's host or CA.
def mcHostTrust = System.getenv('MC_ANDROID_HOST_TRUST_DIR') ?: (new File("${rootDir}/host-trust/xml/modularchat_host_security_config.xml").isFile() ? "${rootDir}/host-trust" : null)
def mcNetworkConfig = '@xml/network_security_config'
if (mcHostTrust) {
    def mcTrustDirectory = new File(mcHostTrust)
    if (!new File(mcTrustDirectory, 'xml/modularchat_host_security_config.xml').isFile() ||
        !new File(mcTrustDirectory, 'raw/modularchat_host_ca.crt').isFile()) {
        throw new GradleException('MC_ANDROID_HOST_TRUST_DIR must contain the generated XML and public host CA.')
    }
    mcNetworkConfig = '@xml/modularchat_host_security_config'
}

android {
    namespace = "io.github.modularchat.pierogiedition"
    compileSdk = rootProject.ext.compileSdkVersion
    ndkVersion '28.2.13676358'
    // Device checks may explicitly select the isolated measurement package.
    testBuildType project.findProperty('mcTestBuildType') ?: 'debug'
    defaultConfig {
        applicationId mcBuild['applicationId'] ?: "io.github.modularchat.pierogiedition"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((mcBuild['versionCode'] ?: '80') as int)
        versionName mcBuild['versionName'] ?: "3.3.1"
        manifestPlaceholders = [mcNetworkSecurityConfig: mcNetworkConfig]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (mcHostTrust) {
        sourceSets.main.res.srcDir new File(mcHostTrust)
    }
    packaging { jniLibs { useLegacyPackaging true } }
    signingConfigs {
        release {
            if (mcProps['storeFile']) {
                storeFile file(mcProps['storeFile'])
                storePassword mcProps['storePassword']
                keyAlias mcProps['keyAlias']
                keyPassword mcProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (mcProps['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        // Measurement copy (scripts/build-perf-android.ps1): same code and optimizations as release, but its own
        // package (installs beside the real app, own empty storage), debug-signed, and without FLAG_SECURE or the
        // biometric gate (see R.bool.mc_perf in MainActivity), so screenshots and adb measurements work.
        // Never distribute it.
        perf {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix ".perf"
            versionNameSuffix "-perf"
            matchingFallbacks = ['release']
            // WebView content debugging (CDP tracing from scripts/trace-device-ui.mjs); the real release is not debuggable.
            debuggable true
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
